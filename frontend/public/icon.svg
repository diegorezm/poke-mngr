<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17203d"/>
      <stop offset="55%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#070912"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#f43f5e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="topHalf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="botHalf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="144"/>
    </clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#ring)" stroke-width="10" stroke-opacity="0.85"/>
  <circle cx="256" cy="256" r="210" fill="url(#halo)"/>
  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#f59e0b" stroke-width="5" stroke-opacity="0.35"/>
  <!-- 4 cardinal account nodes (representing 4-account Deck) -->
  <circle cx="256" cy="72" r="10" fill="#fbbf24"/>
  <circle cx="440" cy="256" r="10" fill="#fbbf24"/>
  <circle cx="256" cy="440" r="10" fill="#fbbf24"/>
  <circle cx="72" cy="256" r="10" fill="#fbbf24"/>
  <!-- Pokeball emblem -->
  <g clip-path="url(#ballClip)">
    <rect x="108" y="108" width="296" height="148" fill="url(#topHalf)"/>
    <rect x="108" y="256" width="296" height="148" fill="url(#botHalf)"/>
    <!-- Glossy highlight -->
    <ellipse cx="204" cy="166" rx="44" ry="22" transform="rotate(-22 204 166)" fill="#ffffff" fill-opacity="0.26"/>
    <!-- Center band -->
    <rect x="108" y="236" width="296" height="40" fill="#0b0f1e"/>
  </g>
  <circle cx="256" cy="256" r="144" fill="none" stroke="#0b0f1e" stroke-width="16"/>
  <!-- Center button -->
  <circle cx="256" cy="256" r="52" fill="#0b0f1e"/>
  <circle cx="256" cy="256" r="36" fill="#f8fafc"/>
  <polygon points="256,232 280,256 256,280 232,256" fill="url(#gem)"/>
  <circle cx="250" cy="249" r="5" fill="#ffffff" fill-opacity="0.85"/>
</svg>
